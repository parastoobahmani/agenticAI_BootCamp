[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-final-project"
version = "1.0.0"
description = "Evidence-grounded, multi-turn Streamlit support assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.25,<5",
    "packaging>=23",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
missing-info = "missing_info.cli:main"
support-agent = "support_agent.cli:main"

[tool.setuptools.packages.find]
include = ["missing_info*", "part1_3*", "part1_3_integration*", "support_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "part1_3/tests", "part1_3_integration/tests"]
