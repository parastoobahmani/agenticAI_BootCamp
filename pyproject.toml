[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-final-project"
version = "1.0.0"
description = "Evidence-grounded, multi-turn Streamlit support assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.25,<5",
    "packaging>=23",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
missing-info = "missing_info.cli:main"
problem2-agent = "problem2_parts1_2.cli:main"
problem2-scenarios = "problem2_part3.scenarios:main"

[tool.setuptools.packages.find]
include = ["missing_info*", "problem1_part3*", "problem1_to_problem2*", "problem2_part3*", "problem2_parts1_2*"]

[tool.pytest.ini_options]
testpaths = ["tests", "problem1_part3/tests", "problem1_to_problem2/tests", "problem2_part3/tests"]
