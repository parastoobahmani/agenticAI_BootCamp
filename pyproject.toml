[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-info"
version = "0.1.0"
description = "Problem 1, part 2: detect missing information in a Streamlit support case and choose the most useful next step."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
    "packaging>=23",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
missing-info = "missing_info.cli:main"

[tool.setuptools.packages.find]
include = ["missing_info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
